# docker-compose.yml (без version)
services:
  # Основное приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=task_manager
      - DB_USERNAME=task_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
    networks:
      - task-network
    depends_on:
      - db
      - redis

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: task-manager-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - task-network
    depends_on:
      - app

  # MySQL
  db:
    image: mysql:8.0
    container_name: task-manager-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: task_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - task-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis
  redis:
    image: redis:7-alpine
    container_name: task-manager-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - task-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: task-manager-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: task_user
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 100M
    networks:
      - task-network
    depends_on:
      - db

  # Mailhog
  # mailhog:
  #   image: mailhog/mailhog
  #   container_name: task-manager-mailhog
  #   restart: unless-stopped
  #   ports:
  #     - "8025:8025"
  #     - "1025:1025"
  #   user: root
  #   networks:
  #     - task-network

networks:
  task-network:
    driver: bridge

volumes:
  db_data: